spring.application.name=SBMTServer

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sbmt}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Flyway (disabled by default until initial migration scripts are added)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs